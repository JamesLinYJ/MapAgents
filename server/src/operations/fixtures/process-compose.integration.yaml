version: "0.5"
is_strict: true
ordered_shutdown: true

processes:
  infra:
    working_dir: '${GEOFORGE_ROOT}'
    command: "node server/src/operations/fixtures/processComposeFixture.mjs run infra"
    readiness_probe:
      exec:
        command: "node server/src/operations/fixtures/processComposeFixture.mjs health infra"
      period_seconds: 1
      timeout_seconds: 2
      failure_threshold: 3
    availability: { restart: on_failure, max_restarts: 3, backoff_seconds: 1 }
  worker:
    working_dir: '${GEOFORGE_ROOT}'
    command: "node server/src/operations/fixtures/processComposeFixture.mjs run worker"
    depends_on: { infra: { condition: process_healthy } }
    readiness_probe:
      exec:
        command: "node server/src/operations/fixtures/processComposeFixture.mjs health worker"
      period_seconds: 1
      timeout_seconds: 2
      failure_threshold: 3
    availability: { restart: on_failure, max_restarts: 3, backoff_seconds: 1 }
  api:
    working_dir: '${GEOFORGE_ROOT}'
    command: "node server/src/operations/fixtures/processComposeFixture.mjs run api"
    depends_on: { worker: { condition: process_healthy } }
    readiness_probe:
      exec:
        command: "node server/src/operations/fixtures/processComposeFixture.mjs health api"
      period_seconds: 1
      timeout_seconds: 2
      failure_threshold: 3
    availability: { restart: on_failure, max_restarts: 3, backoff_seconds: 1 }
  web:
    working_dir: '${GEOFORGE_ROOT}'
    command: "node server/src/operations/fixtures/processComposeFixture.mjs run web"
    depends_on: { api: { condition: process_healthy } }
    readiness_probe:
      exec:
        command: "node server/src/operations/fixtures/processComposeFixture.mjs health web"
      period_seconds: 1
      timeout_seconds: 2
      failure_threshold: 3
    availability: { restart: on_failure, max_restarts: 3, backoff_seconds: 1 }
