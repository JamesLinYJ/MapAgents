name: Apply Codex runtime foundation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '.github/refactor/**'
      - '.github/workflows/apply-codex-runtime-foundation.yml'

permissions:
  contents: write

concurrency:
  group: apply-codex-runtime-foundation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply, validate, and commit
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install native test tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          rg --version

      - name: Normalize source migration helper
        run: node .github/refactor/fix-codex-runtime-foundation-helper.mjs

      - name: Apply source migration
        run: node .github/refactor/apply-codex-runtime-foundation.mjs

      - name: Regenerate locked dependency graph
        env:
          NPM_CONFIG_AUDIT: 'false'
          NPM_CONFIG_FUND: 'false'
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        env:
          NPM_CONFIG_AUDIT: 'false'
          NPM_CONFIG_FUND: 'false'
        run: npm ci

      - name: Build shared contracts
        run: npm run build --workspace @geo-agent-platform/shared-types

      - name: Run Agent runtime tests
        run: npm run test:server

      - name: Build Server
        run: npm run build:server

      - name: Validate dependency graph
        run: node --test scripts/dependency-contract.test.mjs

      - name: Validate release pipeline
        run: npm run test:release-pipeline

      - name: Check patch hygiene
        run: git diff --check

      - name: Remove one-shot migration helpers
        shell: bash
        run: |
          rm -f .github/refactor/apply-codex-runtime-foundation.mjs
          rm -f .github/refactor/fix-codex-runtime-foundation-helper.mjs
          rm -f .github/workflows/apply-codex-runtime-foundation.yml
          rmdir .github/refactor 2>/dev/null || true

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo '没有需要提交的变更。'
            exit 0
          fi
          git commit -m 'refactor(agent): establish Codex-style SDK runtime boundary'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
