services:
  postgis:
    image: ${POSTGIS_IMAGE:-postgis/postgis:16-3.5}
    container_name: geoforge-postgis-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geo_agent}
      POSTGRES_USER: ${POSTGRES_USER:-geo_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGIS_PORT:-5432}:5432"
    volumes:
      - geoforge-postgis-prod:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geo_agent} -d ${POSTGRES_DB:-geo_agent}"]
      interval: 10s
      timeout: 5s
      retries: 12

  martin:
    image: ${MARTIN_IMAGE:-ghcr.io/maplibre/martin:latest}
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      MARTIN_DATABASE_URL: postgresql://${POSTGRES_USER:-geo_agent}:${POSTGRES_PASSWORD}@postgis:5432/${POSTGRES_DB:-geo_agent}
    command: ["--config", "/config/config.yaml"]
    expose:
      - "3000"
    volumes:
      - ../martin/config.yaml:/config/config.yaml:ro

  titiler:
    image: ${TITILER_IMAGE:-ghcr.io/developmentseed/titiler:latest}
    restart: unless-stopped
    command: ["uvicorn", "titiler.application.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    expose:
      - "8000"
    volumes:
      - ${RUNTIME_ROOT:?RUNTIME_ROOT is required}:/data:ro

volumes:
  geoforge-postgis-prod:
