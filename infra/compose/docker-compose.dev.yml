services:
  postgis:
    image: ${POSTGIS_IMAGE:-postgis/postgis:16-3.5}
    container_name: geoforge-postgis-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: geo_agent
      POSTGRES_USER: geo_agent
      POSTGRES_PASSWORD: geo_agent
    ports:
      - "${POSTGIS_PORT:-55432}:5432"
    volumes:
      - geoforge-postgis-dev:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo_agent -d geo_agent"]
      interval: 5s
      timeout: 5s
      retries: 20

  martin:
    image: ${MARTIN_IMAGE:-ghcr.io/maplibre/martin:latest}
    container_name: geoforge-martin-dev
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      MARTIN_DATABASE_URL: postgresql://geo_agent:geo_agent@postgis:5432/geo_agent
    command: ["--config", "/config/config.yaml"]
    ports:
      - "127.0.0.1:${MARTIN_PORT:-3000}:3000"
    volumes:
      - ../martin/config.yaml:/config/config.yaml:ro

  titiler:
    image: ${TITILER_IMAGE:-ghcr.io/developmentseed/titiler:latest}
    container_name: geoforge-titiler-dev
    restart: unless-stopped
    command: ["uvicorn", "titiler.application.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports:
      - "127.0.0.1:${TITILER_PORT:-8001}:8000"
    volumes:
      - ${RUNTIME_ROOT:-../../runtime}:/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  geoforge-postgis-dev:
